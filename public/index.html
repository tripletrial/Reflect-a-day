<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflect a Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1 class="app-title">Reflect a Day</h1>
        <button class="setting-trigger" id="settings-btn" type="button" aria-label="Open settings">
          <span class="setting-label">Setting</span>
          <img class="setting-icon" src="/assets/setting-icon.svg" width="64" height="64" alt="" />
        </button>
      </header>

      <main class="main-grid">
        <section class="session-column" id="session-column">
          <div class="session-top">
            <div class="disc-zone">
              <div class="disc-wrap">
                <button class="session-disc" id="record-btn" type="button" aria-label="Record">
                  <span class="disc-rotate">
                    <span class="disc-outer"></span>
                    <span class="disc-line"></span>
                    <span class="disc-core"></span>
                    <span class="disc-dot"></span>
                    <span class="disc-meta">
                      <span id="disc-date"></span>
                      <span id="disc-status">Ready</span>
                    </span>
                  </span>
                </button>
              </div>
            </div>

            <div class="action-stack">
              <button class="action-cell" id="record-action-btn" type="button">
                <span class="action-label">Record</span>
                <span class="action-icon action-icon-record"></span>
                <span class="action-key">T</span>
              </button>
              <button class="action-cell" id="end-session-btn" type="button" disabled>
                <span class="action-label">End session and save</span>
                <span class="action-icon action-icon-save"></span>
                <span class="action-key">S</span>
              </button>
              <button class="action-cell" id="discard-session-btn" type="button" disabled>
                <span class="action-label">Discard</span>
                <img
                  class="action-icon action-icon-discard"
                  src="/assets/discard-icon.svg"
                  width="64"
                  height="64"
                  alt=""
                />
                <span class="action-key">Delete</span>
              </button>
            </div>
          </div>

          <div class="live-transcript" id="transcript" aria-live="polite"></div>
        </section>

        <aside class="past-panel">
          <div class="past-panel-header">
            <h2 class="past-panel-title">Past reflections</h2>
            <button class="text-link" id="refresh-records-btn" type="button">refresh</button>
          </div>
          <p class="past-panel-empty hidden" id="records-message"></p>
          <div class="past-list" id="records-list"></div>
        </aside>
      </main>
    </div>

    <div id="settings-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel" role="dialog" aria-labelledby="settings-title">
        <header class="overlay-header">
          <h2 id="settings-title">Setting</h2>
          <button class="text-link" id="settings-close-btn" type="button">Close</button>
        </header>

        <div class="overlay-body">
          <p class="overlay-status" id="settings-status"></p>

          <section class="overlay-section">
            <h3>Preferences</h3>
            <label class="settings-toggle">
              <input type="checkbox" id="generate-narration-toggle" checked />
              <span>Generate narration after save</span>
            </label>
            <label class="settings-field" for="tts-voice-select">
              <span>Voiceover</span>
              <select id="tts-voice-select" class="settings-select"></select>
            </label>
          </section>

          <section class="overlay-section">
            <div class="overlay-section-header">
              <h3>Prompt lab</h3>
              <button class="text-link" id="save-prompt-btn" type="button">Save prompt</button>
            </div>
            <p class="overlay-status" id="prompt-status"></p>
            <div class="prompt-tabs">
              <button class="prompt-tab active" type="button" data-prompt="interviewer">Interviewer</button>
              <button class="prompt-tab" type="button" data-prompt="extractor">Extractor</button>
              <button class="prompt-tab" type="button" data-prompt="narrator">Narrator</button>
              <button class="prompt-tab" type="button" data-prompt="revisit">Revisit</button>
            </div>
            <textarea id="prompt-editor" class="prompt-editor" spellcheck="false"></textarea>
          </section>
        </div>
      </div>
    </div>

    <div id="past-overlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-panel overlay-panel-wide" role="dialog" aria-labelledby="past-title">
        <header class="overlay-header">
          <h2 id="past-title">Loading…</h2>
          <button class="text-link" id="past-close-btn" type="button">Close</button>
        </header>

        <div class="overlay-body">
          <section class="overlay-section past-reflection-section">
            <p id="past-summary" class="past-summary"></p>
            <div id="past-highlights" class="past-highlights"></div>
            <div id="past-tags" class="tag-row"></div>
            <footer class="past-reflection-footer">
              <button class="text-link past-delete-btn" id="past-delete-btn" type="button">Delete</button>
            </footer>
          </section>

          <section class="overlay-section">
            <button class="pill-btn" id="hear-this-btn" type="button">Hear this</button>
            <p class="overlay-status" id="narration-status"></p>
            <div id="narration-script" class="narration-script hidden"></div>
          </section>

          <section class="overlay-section">
            <label class="settings-toggle">
              <input type="checkbox" id="ask-past-checkbox" />
              <span>Ask questions about this day</span>
            </label>
            <div id="past-qa" class="past-qa hidden">
              <div id="past-qa-messages" class="past-qa-messages"></div>
              <form id="past-qa-form" class="past-qa-form">
                <input
                  id="past-qa-input"
                  type="text"
                  placeholder="What was I thinking about…?"
                  autocomplete="off"
                />
                <button class="pill-btn" type="submit">Ask</button>
              </form>
            </div>
          </section>

          <details class="past-transcript-details">
            <summary>Full transcript</summary>
            <div id="past-transcript" class="past-transcript"></div>
          </details>
        </div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
